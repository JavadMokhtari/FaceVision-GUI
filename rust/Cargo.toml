[package]
name = "rust_lib_facevision"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
facevision-parallel = { git = "https://github.com/JavadMokhtari/FaceVision.git", tag = "v0.2.4" }
flutter_rust_bridge = "=2.12.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
